name: Build & Release

# 手动触发：Actions 页面 -> Build & Release -> Run workflow
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "CMake 构建类型"
        type: choice
        required: true
        default: "Release"
        options:
          - Release
          - Debug
      release_tag:
        description: "Release 标签（留空则自动生成 ci-<日期>-<sha>）"
        type: string
        required: false
        default: ""
      prerelease:
        description: "标记为预发布 (pre-release)"
        type: boolean
        required: false
        default: false
      draft:
        description: "创建为草稿 (draft)"
        type: boolean
        required: false
        default: false

# 同一时间只跑一个发布流水线，避免产物/Release 冲突
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 创建 Release 需要

env:
  TARGET_NAME: GLFW_Template

jobs:
  build:
    name: Build (${{ matrix.display }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            display: Linux-x64
            runs-on: ubuntu-latest
            artifact: GLFW_Template-linux-x64
          - os: macos
            display: macOS-arm64
            runs-on: macos-latest
            artifact: GLFW_Template-macos-arm64
          - os: windows
            display: Windows-x64
            # 钉死 windows-2022：windows-latest 镜像近期升到 VS 18（MSVC 14.51），
            # 其 C++20 named modules 在 import 侧 TU 触发 STL 头 C2572/C7571 重定义风暴；
            # v1.3.x 系列一直在 VS2022 镜像上验证通过。
            runs-on: windows-2022
            artifact: GLFW_Template-windows-x64

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 依赖安装：Linux
      #   gldx 是 C++20 named module，需要成熟的模块实现 + clang-scan-deps，
      #   Ubuntu 自带的 gcc/clang 不足以编译，故从 apt.llvm.org 装 clang。
      #   版本号必须跟着 apt.llvm.org 的维护窗口走：它只发布 main + 最近两个
      #   release（现在是 22/23），旧分支整条下架——写死 clang-20 时
      #   `apt-get update` 直接报 “llvm-toolchain-<codename>-20 Release does not have
      #   a Release file” 并以 exit 100 碎在装依赖这一步（v1.6.0 的 Linux job）。
      #   注意这跟发行版无关：ubuntu-latest 升到 26.04 (resolute) 只是同一天发生
      #   的另一件事，钉回 ubuntu-24.04 一样拿不到 -20。
      # ------------------------------------------------------------------
      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglfw3-dev libglm-dev \
            libgl1-mesa-dev xorg-dev \
            ninja-build python3-jinja2 wget
          sudo apt-get remove -y cmake || true
          sudo apt-get install -y cmake
          # 固定较新的 Clang（named modules + clang-scan-deps）
          sudo apt-get install -y gnupg lsb-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          echo "deb http://apt.llvm.org/$CODENAME/ llvm-toolchain-$CODENAME-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-23 llvm-23
          echo "CC=clang-23"  >> "$GITHUB_ENV"
          echo "CXX=clang++-23" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 依赖安装：macOS
      #   AppleClang 对 named modules 支持不完整，统一用 brew 的 LLVM clang。
      # ------------------------------------------------------------------
      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install glfw glm ninja uv llvm cmake
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "CC=$LLVM_PREFIX/bin/clang"    >> "$GITHUB_ENV"
          echo "CXX=$LLVM_PREFIX/bin/clang++" >> "$GITHUB_ENV"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------------
      # 依赖安装：Windows (vcpkg + MSVC + Python/jinja2)
      # ------------------------------------------------------------------
      - name: Setup Python (Windows)
        if: matrix.os == 'windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ninja (Windows)
        if: matrix.os == 'windows'
        run: choco install ninja -y

      - name: Install jinja2 (Windows)
        if: matrix.os == 'windows'
        run: python -m pip install --upgrade pip jinja2

      - name: Setup MSVC environment (Windows)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install vcpkg dependencies (Windows)
        if: matrix.os == 'windows'
        run: |
          vcpkg install glfw3:x64-windows glm:x64-windows

      - name: Resolve vcpkg root (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          # 安装用的 vcpkg CLI 与 toolchain 必须指向同一个根目录。
          # Windows runner 上 `vcpkg` 实际是 VCPKG_INSTALLATION_ROOT（C:\vcpkg），
          # 而 VCPKG_ROOT 可能指向 VS 自带的另一个 vcpkg，优先用前者。
          ROOT="${VCPKG_INSTALLATION_ROOT:-$VCPKG_ROOT}"
          echo "Resolved vcpkg root: $ROOT"
          echo "VCPKG_PATH=$ROOT" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 配置 & 构建（统一使用 Ninja，单配置，产物路径固定为 output/）
      # ------------------------------------------------------------------
      - name: Configure
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          RUN_OS: ${{ matrix.os }}
        run: |
          # 用数组传参，避免 $VCPKG_ROOT 中含空格的路径（如
          # "C:\Program Files\...\vcpkg"）被 bash 拆词。
          ARGS=(-S . -B build -G Ninja "-DCMAKE_BUILD_TYPE=$BUILD_TYPE")
          if [ "$RUN_OS" = "windows" ]; then
            ARGS+=("-DCMAKE_TOOLCHAIN_FILE=$VCPKG_PATH/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=x64-windows")
          fi
          echo "vcpkg toolchain root: '$VCPKG_PATH'"
          cmake "${ARGS[@]}"

      - name: Build
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: cmake --build build --config "$BUILD_TYPE"

      # ------------------------------------------------------------------
      # MSVC 对象写出限制取证（仅 Windows，仅构建已失败时）
      #   v1.7.0 起 Windows job 碎在 `fatal error C1605: compiler limit: object
      #   file size cannot exceed 4 GB`，只打在 glass_water/Hud.cpp 与
      #   night_forest/Hud.cpp 上。/bigobj（run 42760865230）、TU 体量、导入
      #   模块数量（C5050 按源文件路径计数）三种解释都被 action 自身证伪了。
      #   run 42765315428 的变体矩阵把范围收窄到正文：六个 flag 变体一字不差，
      #   只留 `import gldx; + Hud.h` 的空函数体骨架编成 1.5 KB 通过，而对
      #   glass_water/Hud.cpp 的前缀二分在 L85 过、L97 起失败，且**所有失败的
      #   前缀都花 11.1 s、所有通过的前缀都只花 1.2 s**——耗时不随代码量增长，
      #   就不是尺寸上限的形状：触发点一旦存在，写出器径直冲到墙上。
      #   第三轮（run 42770837956）不再抽样，直接收敛：两个 TU 二分到**同一句**
      #   `hud.AddLine(buf, kDim);`（glass_water L85 过 / L86 碎，night_forest L56
      #   过 / L57 碎）；`/Od /Gw /GS-` 一字不差，优化器轴与 flag 轴一样全死；`/Fa`
      #   清单在看门狗的 3 s 里只有 285 字节 12 行，还停在 prologue（`include
      #   listing.inc` 与 `_BSS       SEGMENT`）——一条指令都还没写出，所以失控的不是“喂给
      #   写出器的东西”，是写出器自己。
      #   但矩阵自己的对照行在第四轮（run 42777226104）把上一句推翻：在**完整 TU** 上删掉这一句，
      #   两个文件照旧 C1605。二分的答案只能读成“充分而不必要”——前缀里加这一句就过线，而完整
      #   文件里同形调用有 7 处（glass_water）与 12 处（night_forest）。矩阵因此分成两族：A 族在
      #   完整 TU 上只问“这类语句是否参与”（原样、删一处、删全部 N 处）；B 族在最小失败前缀上按
      #   性质改写（导入常量、prvalue、函数内非 constexpr 副本、函数内 const 引用、字符串字面量），
      #   那里删掉这一句确实编得回来，delete 行才是对照行；对照不过就打印 CONTROL DID NOT COMPILE，
      #   下面的行只算噪声。每个轴还各自声明可达性：别名表从源码 grep，旧正则要求 `=` 前恰好一个
      #   空格，而这些文件把等号对齐了（`kDim  = Hud::kDim;`），于是一整条轴既没有行也没有提示。
      #   但探针本身不是：除 cl 命令行外全是 shell，改它之前先跑
      #   scripts/msvc-object-probe-selftest.sh（假 cl.exe，含看门狗必须被杀成
      #   rc=124、并且结束后不得有进程存活的断言）。这条不是洁癖——看门狗的第一版
      #   用 timeout，只杀到了 bash 包装进程，cl 作为子进程继续往已删除的目录里写
      #   清单，是 selftest 把它报出来的；本地遗留的十个孤儿 cl 一度写满了盘。
      #   第五轮（run 42781895430）交回了可操作的修复：B 族里只有 `imported const`
      #   （实参直接写 `Hud::kDim`）一行编译通过（6712/6730 字节），其余仍 ODR-use
      #   本地别名的改写全 C1605，而 delete 对照行（留声明、删调用）也过——所以触发
      #   的是 ODR-use 而非声明本身。两个 demo HUD TU 的别名已删、实参直接写
      #   `Hud::kX`。探针保留：任何 Windows 构建失败仍会跑它。
      #   第六轮（run 42798303106，别名修复之后）证明 C1605 只是第一道墙：glass_water
      #   与 night_forest 的 HUD TU 都过了，构建第一次走到第 498 步 voxel_terrain/Hud.cpp
      #   ——此前每一轮都在 486/491 就死了，这个 TU 从没被编过——那里碎成另一副样子：
      #   C2011 `glm::qualifier` / C2572 / C2953，紧接着 `<vector>` 同样重定义。这不是
      #   写出器问题而是**导入方环境问题**：模块带 /utf-8 编译，30 多个导入方都没有，
      #   于是 MSVC 对每条 import 报 C5050（那场构建共 114 条），并把模块已挂到 global
      #   module 的头再解析一遍。修复＝/utf-8 升级成 gldx/gldxwin/gldxcli 的 PUBLIC 要求
      #   （src/gldx/CMakeLists.txt）+ 导入方的 global-module 头（glm / std）一律 include
      #   在 import 之前（三个 demo HUD TU 已统一，AGENTS.md 不变量 7）。两处 clang 都
      #   看不见，所以这轮起探针不再是唯一的判据：任何 Windows 失败先看有没有 C5050。
      # ------------------------------------------------------------------
      - name: Probe MSVC object-writer limit (Windows, on failure)
        if: failure() && matrix.os == 'windows'
        shell: bash
        run: bash scripts/msvc-object-probe.sh build

      # ------------------------------------------------------------------
      # 打包产物
      # ------------------------------------------------------------------
      - name: Stage runtime DLLs & package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          # vcpkg 默认 shared triplet，glfw 运行期需要 dll，一并放入 output/
          Copy-Item "$env:VCPKG_PATH\installed\x64-windows\bin\*.dll" output/ -Force
          Compress-Archive -Path output/* -DestinationPath "$env:ARTIFACT.zip"

      - name: Package (Linux / macOS)
        if: matrix.os != 'windows'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          cd output
          zip -r "../$ARTIFACT.zip" .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  # ======================================================================
  # 汇总三平台产物，创建 GitHub Release
  # ======================================================================
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
            TAG="ci-$(date +%Y%m%d)-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated release tag: $TAG"

      - name: List artifacts
        run: ls -R dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "GLFW_Template ${{ steps.meta.outputs.tag }}"
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: dist/*.zip
